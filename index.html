<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <header>
        Header
    </header>
    <nav>
        <div class="nav-container">
            <div class="dashboard-header-container">
            <img id="home-svg" src="./svg/view-dashboard.svg" height="30px" width="30px"><h1 id="dashboard">Dashboard</h1>
            </div>
            <div class="dashboard-one">
                <div class="item-container">
                <img class="dashboard-svg" src="./svg/home.svg"><h3 id="home">Home</h3>
                </div>
                <div class="item-container">
                <img class="dashboard-svg" src="./svg/card-account-details.svg"><h3 id="messages">Profile</h3>
                </div>
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/message-reply.svg"><h3 id="history">Messages</h3>
                </div>
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/file-multiple.svg"><h3 id="tasks">Tasks</h3>
                </div>
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/account-group.svg"><h3 id="communities">Communities</h3>
                </div>
            </div>
            <div class="dashboard-two">
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/cog.svg"><h3 id="settings">Settings</h3>
                </div>
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/help-box.svg"><h3 id="support">Support</h3>
                </div>
                <div class="item-container">
                    <img class="dashboard-svg" src="./svg/shield-check.svg"><h3 id="privacy">Privacy</h3>
                </div>
            </div>
        </div>
    </nav>
    <main>Main</main>
    <aside>Aside</aside>
    </div>
</body>
</html>
